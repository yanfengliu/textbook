name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from 2026-10-19: the timings below and
    # the system libraries --with-deps installs were measured on 24.04, and a new image under them would
    # change both without a commit to show for it. Move it on purpose, and re-measure when you do.
    runs-on: ubuntu-24.04
    # A guard against a hung run, sized so a healthy run never meets it. The old 30 could not be met: no
    # run has ever got past drive, and the job reaches the end of drive at about 20.5 minutes on this
    # 4-CPU, 15 GB runner (runs 35940597512 on main and 35941037349 on a branch, 2026-09-24). Drive
    # alone took 936 s there against 513 s locally, 1.8 times as long. The gates after drive took 1721 s
    # locally on 32 logical CPUs on 2026-09-23 (docs/work/7_project-audit/reviews/2_integration.md,
    # with pinned at its one-process 410 s, because its eight shards share the runner's cores); at 1.8
    # times that is about 52 minutes, so the whole job is near 72 minutes here, and near 145 on the
    # 2-core runner a private repository gets if every step takes twice as long. 240 covers the 2-core
    # case two thirds again and stays under GitHub's 360-minute ceiling. These are estimates: replace
    # them with the duration of the first run that completes every step.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # The machine every step's time below was measured on. The log does not say it otherwise.
      - name: Record the runner's size
        run: |
          echo "$(nproc) logical CPUs, $(free -g | awk '/^Mem:/ {print $2}') GB of memory"
      - run: npm ci
      # Three engines. Every browser gate drives chromium, and npm run devices also loads the library and
      # chapter 1 in WebKit and Firefox (ENGINES and CROSS_PAGES in tools/devices.js) with no fallback
      # when one is missing, so a chromium-only install fails that step. --with-deps brings the system
      # libraries the runner does not ship; all three took 49 s here (run 35938466158).
      - run: npx playwright install --with-deps chromium webkit firefox
      # The runner has no GPU, so the 3D figures render through SwiftShader. npm run perf is
      # deliberately not run here: it measures the machine it runs on.
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-output
          path: out/
          retention-days: 7
