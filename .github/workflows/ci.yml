name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 from 2026-10-19: the timings below and
    # the system libraries --with-deps installs were measured on 24.04, and a new image under them would
    # change both without a commit to show for it. Move it on purpose, and re-measure when you do.
    runs-on: ubuntu-24.04
    # A guard against a hung run, sized so a healthy run never meets it. The old 30 could not be met:
    # unit, check, shot, flow and drive alone used about 15 of those minutes here (910 s), and no run
    # ever got past drive. The whole chain took 2180 s (36 min) on 32 logical CPUs on 2026-09-23
    # (docs/work/7_project-audit/reviews/2_integration.md). On this 4-CPU, 15 GB runner (run 35938466158)
    # only the gates up to drive have run: drive alone took 754 s against 513 s locally (run
    # 35902188268), and theme, added since, 32 s. The gates after drive, scaled the way drive scaled,
    # with pinned at its one-process time because its eight shards share the runner's cores, put the
    # chain near 60 minutes on the 4-core runner a public repository gets and near 120 on the 2-core one
    # a private repository gets. 180 covers the 2-core case half again and stays under GitHub's
    # 360-minute ceiling. These are estimates: replace them with the duration of the first run that
    # completes every step.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # The machine every step's time below was measured on. The log does not say it otherwise.
      - name: Record the runner's size
        run: |
          echo "$(nproc) logical CPUs, $(free -g | awk '/^Mem:/ {print $2}') GB of memory"
      - run: npm ci
      # Three engines. Every browser gate drives chromium, and npm run devices also loads the library and
      # chapter 1 in WebKit and Firefox (ENGINES and CROSS_PAGES in tools/devices.js) with no fallback
      # when one is missing, so a chromium-only install fails that step. --with-deps brings the system
      # libraries the runner does not ship; all three took 49 s here (run 35938466158).
      - run: npx playwright install --with-deps chromium webkit firefox
      # The runner has no GPU, so the 3D figures render through SwiftShader. npm run perf is
      # deliberately not run here: it measures the machine it runs on.
      - run: npm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-output
          path: out/
          retention-days: 7
